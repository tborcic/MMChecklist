<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Majora's Mask 3D — 100% Hearts & Masks Tracker</title>
  <style>
    :root {
      --bg: #120f1d;
      --surface: #1d1830;
      --surface-hover: #272040;
      --border: #362c59;
      --text: #f3effa;
      --muted: #a69ec2;
      --accent: #a855f7;
      --gold: #facc15;
      --heart: #f43f5e;
      --green: #10b981;
      --sky: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 4rem;
    }

    header {
      background: linear-gradient(180deg, #24193d 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1rem 0.9rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    @media (max-width: 760px), (max-height: 600px) { header { position: static; } }

    .container { max-width: 1120px; margin: 0 auto; padding: 0 1rem; }

    .top-bar {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      align-items: center; gap: 1rem; margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em;
      display: flex; align-items: center; gap: 0.5rem;
    }

    h1 span.badge {
      font-size: 0.75rem; background: var(--accent); color: #fff;
      padding: 0.15rem 0.5rem; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }

    h1 span.version { font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-left: 0.35rem; }

    .top-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

    button.btn-secondary {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 0.55rem 0.85rem; border-radius: 8px; font-size: 0.85rem; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button.btn-secondary:hover { background: var(--surface-hover); border-color: var(--accent); }

    button.reset-btn {
      background: transparent; border: 1px solid #5c2838; color: #fda4af;
      padding: 0.55rem 0.9rem; border-radius: 8px; font-size: 0.85rem; cursor: pointer;
      transition: background 0.15s;
    }
    button.reset-btn:hover { background: rgba(244, 63, 94, 0.15); }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.5rem; margin-bottom: 0.8rem;
    }
    .how-row { align-items: flex-start; }
    .how-list { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.82rem; color: var(--muted); }
    .how-line b { color: var(--text, inherit); }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.45rem 0.7rem; }
    .stat-label { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .stat-value { font-size: 1.02rem; font-weight: 700; margin-top: 0.05rem; }
    .stat-value.hearts { color: var(--heart); }
    .stat-value.masks { color: var(--gold); }
    .stat-value.steps { color: var(--sky); }
    .stat-value.gear { color: var(--green); }

    .controls { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }

    input[type="search"], select {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 0.55rem 0.85rem; border-radius: 8px; font-size: 0.9rem; outline: none;
    }
    input[type="search"] { flex: 1; min-width: 210px; }
    input[type="search"]:focus, select:focus { border-color: var(--accent); }

    .filter-toggle {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 0.5rem 0.85rem; border-radius: 8px; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; user-select: none; transition: background 0.15s, border-color 0.15s;
    }
    .filter-toggle:hover { background: var(--surface-hover); border-color: var(--green); }

    .filter-toggle input[type="checkbox"], .inv-item input[type="checkbox"] {
      appearance: none; width: 18px; height: 18px; min-width: 18px;
      border: 2px solid var(--green); border-radius: 5px;
      display: grid; place-content: center; background: #120f1d; cursor: pointer;
    }
    .filter-toggle input[type="checkbox"]:checked, .inv-item input[type="checkbox"]:checked {
      background: var(--green); border-color: var(--green);
    }
    .filter-toggle input[type="checkbox"]:checked::after, .inv-item input[type="checkbox"]:checked::after {
      content: "✓"; color: #052e16; font-weight: 900; font-size: 12px;
    }

    .inventory-panel {
      margin-top: 1.5rem; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1rem 1.15rem;
    }
    .inventory-header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 0.75rem; margin-bottom: 0.85rem; padding-bottom: 0.55rem; border-bottom: 1px solid var(--border);
    }
    .inventory-title { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    .inventory-actions { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .inv-group-title {
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
      margin: 0.75rem 0 0.45rem; font-weight: 700;
    }
    .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.45rem; }
    .inv-text { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
    .inv-label { font-weight: 600; }
    .inv-how { font-size: 0.74rem; color: var(--muted); line-height: 1.3; }
    .inv-jump { font-size: 0.72rem; }
    .inv-jump a { color: var(--accent); text-decoration: underline dotted; }
    .inv-item {
      display: flex; align-items: center; gap: 0.55rem; background: #151124;
      border: 1px solid #2b2247; border-radius: 8px; padding: 0.5rem 0.65rem;
      font-size: 0.86rem; cursor: pointer; user-select: none; transition: border-color 0.15s, background 0.15s;
    }
    .inv-item:hover { background: #211a38; border-color: var(--accent); }
    .inv-item.owned { border-color: rgba(16, 185, 129, 0.55); background: rgba(16, 185, 129, 0.08); }

    .section-title {
      font-size: 1.2rem; font-weight: 700; margin: 2rem 0 0.75rem; padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
    }
    .section-count { font-size: 0.85rem; color: var(--muted); font-weight: 500; }

    .checklist { display: grid; gap: 0.65rem; }

    .item {
      display: flex; align-items: flex-start; gap: 0.85rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem 1rem;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .item:hover { background: var(--surface-hover); border-color: var(--accent); }
    .item.checked { opacity: 0.62; background: #161224; }
    .item.checked .item-title { text-decoration: line-through; color: var(--muted); }

    .item input[type="checkbox"].main-check {
      appearance: none; width: 22px; height: 22px; min-width: 22px;
      border: 2px solid var(--accent); border-radius: 6px; margin-top: 2px;
      display: grid; place-content: center; cursor: pointer; background: #120f1d;
    }
    .item input[type="checkbox"].main-check:checked { background: var(--green); border-color: var(--green); }
    .item input[type="checkbox"].main-check:checked::after { content: "✓"; color: #052e16; font-weight: 900; font-size: 14px; }

    .item-body { flex: 1; min-width: 0; }
    .item-header { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; margin-bottom: 0.35rem; }
    .item-title { font-weight: 700; font-size: 1rem; cursor: pointer; }

    .tag { font-size: 0.72rem; padding: 0.12rem 0.5rem; border-radius: 6px; font-weight: 600; background: #2b2347; color: #d8b4fe; }
    .tag.mask { background: rgba(250, 204, 21, 0.15); color: var(--gold); }
    .tag.heart { background: rgba(244, 63, 94, 0.15); color: #fda4af; }
    .tag.container { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
    .tag.day { background: rgba(56, 189, 248, 0.15); color: var(--sky); }
    .tag.tod { background: rgba(168, 85, 247, 0.18); color: #e9d5ff; }
    .tag.ready { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; }
    .tag.missing { background: rgba(244, 63, 94, 0.15); color: #fda4af; }
    .tag.chain { background: rgba(245, 158, 11, 0.16); color: #fcd34d; }
    .planner-chain { color: var(--muted); font-size: 0.8rem; margin-top: 0.2rem; }
    .planner-chain a { color: var(--accent); text-decoration: underline dotted; cursor: pointer; }

    .item-desc { font-size: 0.92rem; color: #d4cee8; }

    .req-block { margin-top: 0.55rem; display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.82rem; }
    .req-row { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
    .req-label { color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; margin-right: 0.2rem; }
    .gear-chip { padding: 0.1rem 0.45rem; border-radius: 5px; font-weight: 600; font-size: 0.76rem; }
    .gear-chip.have { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.35); }
    .gear-chip.need { background: rgba(244, 63, 94, 0.1); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.35); }
    .cond-text { color: #e2dcf5; }

    .item-meta { margin-top: 0.5rem; font-size: 0.82rem; color: #cbd5e1; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
    .item-meta a { color: #c084fc; text-decoration: none; font-weight: 600; }
    .item-meta a:hover { text-decoration: underline; }

    .toggle-steps-btn {
      background: #251d40; border: 1px solid #433670; color: #e9d5ff; font-size: 0.78rem; font-weight: 600;
      padding: 0.22rem 0.6rem; border-radius: 6px; cursor: pointer; transition: background 0.15s, border-color 0.15s;
    }
    .toggle-steps-btn:hover { background: #312654; border-color: var(--accent); }

    .sub-checklist {
      margin-top: 0.65rem; padding: 0.65rem 0.8rem; background: #141022; border: 1px solid #2c234a;
      border-radius: 8px; display: none; flex-direction: column; gap: 0.5rem;
    }
    .sub-checklist.open { display: flex; }

    .sub-item { display: flex; align-items: flex-start; gap: 0.55rem; font-size: 0.86rem; color: #ddd6fe; cursor: pointer; user-select: none; }
    .sub-item .step-num { color: var(--sky); font-weight: 700; min-width: 1.4rem; }
    .sub-item.done span.step-text { text-decoration: line-through; color: var(--muted); }

    .sub-item input[type="checkbox"].sub-check {
      appearance: none; width: 16px; height: 16px; min-width: 16px; border: 1.5px solid var(--sky);
      border-radius: 4px; margin-top: 3px; display: grid; place-content: center; cursor: pointer; background: #120f1d;
    }
    .sub-item input[type="checkbox"].sub-check:checked { background: var(--sky); border-color: var(--sky); }
    .sub-item input[type="checkbox"].sub-check:checked::after { content: "✓"; color: #082f49; font-weight: 900; font-size: 11px; }

    .tip-box {
      margin-top: 0.3rem; padding: 0.45rem 0.65rem; border-left: 3px solid var(--gold);
      background: rgba(250, 204, 21, 0.06); font-size: 0.82rem; color: #fde68a; border-radius: 0 6px 6px 0;
    }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }

    .view-tabs { display: flex; gap: 0.35rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .view-tabs button {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 0.45rem 1rem; border-radius: 999px; font-size: 0.88rem; font-weight: 700; cursor: pointer;
    }
    .view-tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .now-controls { margin-bottom: 0.6rem; display: none; }
    .now-controls.show { display: flex; }

    .tag.bottle { background: rgba(56, 189, 248, 0.15); color: var(--sky); }
    .tag.fairy { background: rgba(236, 72, 153, 0.15); color: #f9a8d4; }
    .tag.now { background: rgba(250, 204, 21, 0.2); color: var(--gold); }
    .tag.cycle { background: rgba(251, 146, 60, 0.15); color: #fdba74; }
    .tag.note { background: rgba(250, 204, 21, 0.12); color: #fde68a; }

    .link-chip {
      padding: 0.1rem 0.45rem; border-radius: 5px; font-weight: 600; font-size: 0.76rem; cursor: pointer;
      background: rgba(168, 85, 247, 0.12); color: #e9d5ff; border: 1px solid rgba(168, 85, 247, 0.35);
    }
    .link-chip:hover { border-color: var(--accent); background: rgba(168, 85, 247, 0.25); }
    .link-chip.done { opacity: 0.55; text-decoration: line-through; }
    .gear-chip.clickable { cursor: pointer; text-decoration: underline dotted; }
    .when-chip { padding: 0.1rem 0.45rem; border-radius: 5px; font-size: 0.76rem; background: rgba(56, 189, 248, 0.1); color: #bae6fd; border: 1px solid rgba(56, 189, 248, 0.3); }

    .region-progress { height: 5px; background: #2b2247; border-radius: 999px; overflow: hidden; margin: -0.45rem 0 0.8rem; }
    .region-progress > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); }

    .notes-box {
      width: 100%; margin-top: 0.55rem; min-height: 64px; resize: vertical; background: #141022; color: var(--text);
      border: 1px solid #2c234a; border-radius: 8px; padding: 0.5rem 0.65rem; font: inherit; font-size: 0.85rem;
    }
    .notes-box:focus { outline: none; border-color: var(--gold); }

    .counter { display: inline-flex; align-items: center; gap: 0.35rem; font-weight: 700; }
    .counter button {
      width: 26px; height: 26px; border-radius: 6px; border: 1px solid #433670; background: #251d40;
      color: #e9d5ff; font-weight: 800; cursor: pointer;
    }
    .counter button:hover { border-color: var(--accent); }

    .toast {
      position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%) translateY(150%);
      background: #2a2145; border: 1px solid var(--accent); color: var(--text); padding: 0.65rem 0.9rem;
      border-radius: 10px; font-size: 0.88rem; z-index: 200; transition: transform 0.2s; max-width: 92vw;
      display: flex; gap: 0.75rem; align-items: center; box-shadow: 0 8px 30px rgba(0,0,0,0.45);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 0.3rem 0.7rem; font-weight: 700; cursor: pointer; }
    [role="button"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    .item.flash { animation: flash 1.6s ease-out; }
    @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--gold); } 100% { box-shadow: 0 0 0 0 transparent; } }

    .planner-intro { color: var(--muted); font-size: 0.88rem; margin-top: 1.5rem; }
    .planner-period { margin-top: 1.4rem; }
    .planner-row {
      display: grid; grid-template-columns: 165px 1fr auto; gap: 0.75rem; align-items: start;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.6rem 0.8rem; margin-top: 0.4rem; font-size: 0.88rem;
    }
    .planner-time { color: var(--sky); font-weight: 700; }
    .planner-title { font-weight: 700; color: #e9d5ff; cursor: pointer; }
    .planner-title:hover { text-decoration: underline; }
    .planner-label { color: #d4cee8; }
    .planner-tags { display: flex; gap: 0.3rem; flex-wrap: wrap; justify-content: flex-end; }
    @media (max-width: 640px) { .planner-row { grid-template-columns: 1fr; } .planner-tags { justify-content: flex-start; } }
  </style>
</head>
<body>

<header>
  <div class="container">
    <div class="top-bar">
      <h1>Majora's Mask 3D <span class="badge">Checklist</span> <span class="version" id="app-version"></span></h1>
      <div class="top-actions">
        <button class="btn-secondary" onclick="toggleInventoryPanel()">Toggle Collected Gear</button>
        <button class="btn-secondary" onclick="toggleAllSteps(true)">Expand All Steps</button>
        <button class="btn-secondary" onclick="toggleAllSteps(false)">Collapse All Steps</button>
        <button class="btn-secondary" onclick="exportProgress()">Export Progress</button>
        <button class="btn-secondary" onclick="document.getElementById('import-file').click()">Import Progress</button>
        <input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="importProgress(this)" />
        <button class="reset-btn" onclick="resetProgress()">Reset All Checkmarks</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Hearts</div><div class="stat-value hearts" id="heart-meter">3 / 20 Hearts</div></div>
      <div class="stat-card"><div class="stat-label">Pieces of Heart</div><div class="stat-value" id="hp-count">0 / 52</div></div>
      <div class="stat-card"><div class="stat-label">Heart Containers</div><div class="stat-value" id="hc-count">0 / 4</div></div>
      <div class="stat-card"><div class="stat-label">Masks Collected</div><div class="stat-value masks" id="mask-count">0 / 24</div></div>
      <div class="stat-card"><div class="stat-label">Bottles</div><div class="stat-value gear" id="bottle-count">0 / 7</div></div>
      <div class="stat-card"><div class="stat-label">Great Fairy Rewards</div><div class="stat-value masks" id="fairy-count">0 / 4</div></div>
      <div class="stat-card"><div class="stat-label">Songs Learned</div><div class="stat-value gear" id="song-count">0 / 10</div></div>
      <div class="stat-card"><div class="stat-label">Equipment Found</div><div class="stat-value gear" id="equip-count">0 / 10</div></div>
      <div class="stat-card"><div class="stat-label">Collected Gear</div><div class="stat-value gear" id="gear-count">0 / 0</div></div>
    </div>


    <div class="view-tabs" id="view-tabs">
      <button type="button" data-view="checklist" onclick="setView('checklist')">Checklist</button>
      <button type="button" data-view="planner" onclick="setView('planner')">Cycle Planner</button>
      <button type="button" data-view="now" onclick="setView('now')">Right Now</button>
    </div>

    <div class="controls now-controls" id="now-controls">
      <span class="req-label">It is</span>
      <select id="now-day" onchange="onNowChange()">
        <option value="1">Day 1 (First Day)</option>
        <option value="2">Day 2 (Second Day)</option>
        <option value="3">Day 3 (Final Day)</option>
      </select>
      <select id="now-hour" onchange="onNowChange()"></select>
      <label class="filter-toggle">
        <input type="checkbox" id="now-anytime" onchange="onNowChange()" />
        <span>Also show anytime items I have gear for</span>
      </label>
    </div>

    <div class="controls">
      <input type="search" id="search" placeholder="Search mask, location, day, time, step, or required item..." oninput="render()" />
      <select id="type-filter" onchange="render()">
        <option value="all">All Categories (111)</option>
        <option value="mask">Masks Only (24)</option>
        <option value="heart">Pieces of Heart Only (52)</option>
        <option value="container">Boss Heart Containers (4)</option>
        <option value="bottle">Bottles (7)</option>
        <option value="fairy">Stray Fairies / Great Fairies (4)</option>
        <option value="song">Songs (10)</option>
        <option value="gear">Equipment (10)</option>
      </select>
      <select id="sort-mode" onchange="onSortChange()">
        <option value="default">Sort: Game order</option>
        <option value="closest">Sort: Closest to done</option>
      </select>
      <select id="group-mode" onchange="onGroupChange()">
        <option value="region">Group: By region</option>
        <option value="type">Group: By category</option>
      </select>
      <select id="day-filter" onchange="render()">
        <option value="all">All Days / Anytime</option>
        <option value="Anytime">Anytime</option>
        <option value="Day 1">Day 1</option>
        <option value="Night 1">Night 1</option>
        <option value="Day 2">Day 2</option>
        <option value="Night 2">Night 2</option>
        <option value="Day 3">Day 3</option>
        <option value="Night 3">Night 3</option>
        <option value="3-Day Cycle">Multi-Day / 3-Day Cycle</option>
      </select>
      <select id="tod-filter" onchange="render()">
        <option value="all">All Times of Day</option>
        <option value="Anytime">Any Time</option>
        <option value="Morning / Day">Morning / Day (6 AM–6 PM)</option>
        <option value="Evening">Evening (6 PM–12 AM)</option>
        <option value="Late Night">Late Night (12 AM–6 AM)</option>
        <option value="Multi-Time">Multi-Time / Sequence</option>
      </select>
      <select id="region-filter" onchange="render()">
        <option value="all">All Regions</option>
        <option value="Clock Town">Clock Town</option>
        <option value="Termina Field & Ranch">Termina Field & Romani Ranch</option>
        <option value="Southern Swamp & Woodfall">Southern Swamp & Woodfall</option>
        <option value="Snowhead & Mountains">Snowhead & Mountains</option>
        <option value="Great Bay">Great Bay</option>
        <option value="Ikana Canyon">Ikana</option>
        <option value="The Moon">The Moon</option>
      </select>
      <select id="status-filter" onchange="render()">
        <option value="all">Show All</option>
        <option value="unchecked">Uncollected Only</option>
        <option value="checked">Collected Only</option>
      </select>
      <label class="filter-toggle" title="Show only items whose required gear/items/masks you have checked as collected">
        <input type="checkbox" id="owned-only-filter" onchange="render()" />
        <span>Items I Have On Me</span>
      </label>
      <label class="filter-toggle" title="Hide masks, heart pieces and containers you've already marked as completed">
        <input type="checkbox" id="hide-completed-filter" onchange="onHideCompletedChange()" />
        <span>Hide Completed</span>
      </label>
    </div>
  </div>
</header>

<div class="container">
  <section class="inventory-panel" id="inventory-panel">

// Checklist items that grant gear: ticking the item ticks the gear (trade items are consumed, so excluded)
const GEAR_ALL_OF = new Set(["g_remains"]);
// Gear whose linked checklist item is only an approximate prerequisite: never auto-ticked
// Letters/pendant arrive mid-quest from an item that is only finished later, so they are never auto-ticked (the title deeds are)
const PARTIAL_QUEST_GEAR = new Set(["g_letter_kafei", "g_pendant", "g_express_mail"]);
const GEAR_NO_AUTO = new Set([]);
function gearGrantedBy(itemId) {
  return GEAR_ITEMS.filter(g => !GEAR_NO_AUTO.has(g.id) && !PARTIAL_QUEST_GEAR.has(g.id) && !GEAR_TO_MASK[g.id] && !GEAR_NO_AUTO.has(g.id) &&
    GEAR_SOURCE[g.id] && (GEAR_SOURCE[g.id].items || []).includes(itemId)).map(g => g.id);
}
function gearSatisfied(gearId) {
  const src = GEAR_SOURCE[gearId].items || [];
  return GEAR_ALL_OF.has(gearId) ? src.every(i => checkedSet.has(i)) : src.some(i => checkedSet.has(i));
}
function syncGearFromItems(itemId) {
  const ids = itemId ? gearGrantedBy(itemId) : GEAR_ITEMS.filter(g => !GEAR_NO_AUTO.has(g.id) && !PARTIAL_QUEST_GEAR.has(g.id) && !GEAR_TO_MASK[g.id] && !GEAR_NO_AUTO.has(g.id) && GEAR_SOURCE[g.id] && (GEAR_SOURCE[g.id].items || []).length).map(g => g.id);
  // Add-only: unticking a step/item must never take away gear you already marked as on hand
  for (const g of ids) if (gearSatisfied(g)) ownedGearSet.add(g);
}

function gearSourceItems(gearId) {
  if (GEAR_TO_MASK[gearId]) return [GEAR_TO_MASK[gearId]];
  return (GEAR_SOURCE[gearId] && GEAR_SOURCE[gearId].items) || [];
}
function gearSourceText(gearId) {
  if (GEAR_TO_MASK[gearId]) {
    const m = ITEMS.find(i => i.id === GEAR_TO_MASK[gearId]);
    return m ? `Get it from the checklist entry: ${m.title}` : "";
  }
  return (GEAR_SOURCE[gearId] && GEAR_SOURCE[gearId].text) || "";
}

const ITEM_BY_ID = Object.fromEntries(ITEMS.map(i => [i.id, i]));

// Starting/prologue gear everyone has early — not worth linking from every item
const BASIC_GEAR = new Set(["g_ocarina", "g_sot", "g_soh", "g_magic", "g_sword"]);
const expandedUnlocks = new Set();
function toggleUnlocks(id) { if (expandedUnlocks.has(id)) expandedUnlocks.delete(id); else expandedUnlocks.add(id); render(); }

// "Needs first": checklist items that give a required single piece of gear, plus explicit needs
function needsFirst(item) {
  const ids = new Set(EXTRA_NEEDS[item.id] || []);
  for (const r of item.requiresGear || []) {
    if (Array.isArray(r) || BASIC_GEAR.has(r)) continue;
    for (const src of gearSourceItems(r)) ids.add(src);
  }
  ids.delete(item.id);
  return [...ids].filter(id => ITEM_BY_ID[id]);

// ==================== STATE ====================
const STORAGE_KEY = "mm3d_checklist_v4";

let checkedSet = loadSet(STORAGE_KEY);

let invOpen = true;
try { invOpen = JSON.parse(localStorage.getItem(INV_OPEN_KEY) ?? "true"); } catch (e) {}
let hideCompleted = true; // default on
try { hideCompleted = JSON.parse(localStorage.getItem(HIDE_DONE_KEY) ?? "true"); } catch (e) {}

const notesOpen = new Set();
let forceShowId = null;
let jumpFilterSig = null;

// Rebuild every piece of state from known-good values only. Used on load AND on import,
// so a hand-edited or malicious save file can't inject HTML/script into the page.
const VALID_VIEWS = new Set(["checklist", "planner", "now"]);
const VALID_SORTS = new Set(["default", "closest"]);
const VALID_GROUPS = new Set(["region", "type"]);
function cleanUi(raw) {

  const day = Number(r.nowDay), hour = Number(r.nowHour);
  return {
    view: VALID_VIEWS.has(r.view) ? r.view : "checklist",
    sort: VALID_SORTS.has(r.sort) ? r.sort : "default",

}
function cleanStringSet(set, isValid) { return new Set([...set].filter(x => typeof x === "string" && isValid(x))); }

function sanitizeState() {
  const validItems = new Set(ITEMS.map(i => i.id));
  const validSteps = new Set(ITEMS.flatMap(i => (i.steps || []).map((_, idx) => stepKey(i, idx))));
  checkedSet = cleanStringSet(checkedSet, id => validItems.has(id));
  ownedGearSet = cleanStringSet(ownedGearSet, id => Boolean(GEAR_BY_ID[id]));
  openStepsSet = cleanStringSet(openStepsSet, id => validItems.has(id));
  subCheckedSet = cleanStringSet(subCheckedSet, k => validSteps.has(k));
  const cleanNotes = {};
  for (const [id, v] of Object.entries(notes && typeof notes === "object" ? notes : {})) {
    if (validItems.has(id) && typeof v === "string" && v.trim()) cleanNotes[id] = v.slice(0, 5000);
  }
  notes = cleanNotes;
  const cleanFairies = {};
  for (const item of ITEMS) {
    if (item.type !== "fairy") continue;
    const n = Math.floor(Number(fairyCounts && fairyCounts[item.id]));
    if (Number.isFinite(n) && n > 0) cleanFairies[item.id] = Math.min(15, n);
  }
  fairyCounts = cleanFairies;
  ui = cleanUi(ui);
  hideCompleted = hideCompleted !== false;
  invOpen = invOpen !== false;
  // Masks sync both ways between checklist and gear
  for (const id of checkedSet) if (MASK_TO_GEAR[id]) ownedGearSet.add(MASK_TO_GEAR[id]);
  for (const id of ownedGearSet) if (GEAR_TO_MASK[id]) checkedSet.add(GEAR_TO_MASK[id]);
}
sanitizeState();
syncGearFromItems();

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...checkedSet]));
    localStorage.setItem(SUB_STORAGE_KEY, JSON.stringify([...subCheckedSet]));
    localStorage.setItem(OPEN_STORAGE_KEY, JSON.stringify([...openStepsSet]));
    localStorage.setItem(GEAR_STORAGE_KEY, JSON.stringify([...ownedGearSet]));
    localStorage.setItem(INV_OPEN_KEY, JSON.stringify(invOpen));
    localStorage.setItem(HIDE_DONE_KEY, JSON.stringify(hideCompleted));
    localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
    localStorage.setItem(FAIRY_KEY, JSON.stringify(fairyCounts));
    localStorage.setItem(UI_KEY, JSON.stringify(ui));

}

// ==================== HELPERS ====================
function reqOwned(r) { return Array.isArray(r) ? r.some(id => ownedGearSet.has(id)) : ownedGearSet.has(r); }
function gearName(id) { return GEAR_BY_ID[id] ? GEAR_BY_ID[id].label : id; }
function reqLabel(r) { return Array.isArray(r) ? r.map(gearName).join(" or ") : gearName(r); }
function hasAllRequiredGear(item) { return (item.requiresGear || []).every(reqOwned); }
function missingCount(item) { return (item.requiresGear || []).filter(r => !reqOwned(r)).length; }
function escAttr(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }
function escHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function fmtHour(h) {
  const total = Math.round(h * 60);
  let hr = Math.floor(total / 60) % 24;
  const min = total % 60;
  const ampm = hr >= 12 ? "PM" : "AM";
  const h12 = hr % 12 === 0 ? 12 : hr % 12;
  return `${h12}:${String(min).padStart(2, "0")} ${ampm}`;
}
function periodName(d, h) { return h >= 6 && h < 18 ? `Day ${d}` : `Night ${d}`; }
function fmtWindow(w) { if (w.anytime) return "any time, from Day 1"; return `${periodName(w.d, w.s)} · ${fmtHour(w.s)}–${fmtHour(w.e)}`; }

function stepProgress(item) {
  const steps = item.steps || [];
  if (!steps.length) return 0;
  return steps.filter((_, idx) => subCheckedSet.has(stepKey(item, idx))).length / steps.length;
}
// Ready items first, then most sub-steps done, then fewest missing; ties keep game order
const ORDER = Object.fromEntries(ITEMS.map((i, n) => [i.id, n]));
function compareClosest(a, b) {
  const ma = missingCount(a), mb = missingCount(b);
  if ((ma === 0) !== (mb === 0)) return ma === 0 ? -1 : 1;
  const pa = stepProgress(a), pb = stepProgress(b);
  if (pa !== pb) return pb - pa;
  if (ma !== mb) return ma - mb;

}

// ==================== ACTIONS ====================
function markItemChecked(id, checked) {
  if (checked) checkedSet.add(id); else checkedSet.delete(id);
  const gearId = MASK_TO_GEAR[id];
  if (gearId) { if (checked) ownedGearSet.add(gearId); else ownedGearSet.delete(gearId); }
  syncGearFromItems(id);
}

function toggleGear(gearId) {
  const nowOwned = !ownedGearSet.has(gearId);
  if (nowOwned) ownedGearSet.add(gearId); else ownedGearSet.delete(gearId);
  const maskId = GEAR_TO_MASK[gearId];
  if (maskId) { if (nowOwned) checkedSet.add(maskId); else checkedSet.delete(maskId); syncGearFromItems(maskId); }
  save(); render();
}

function setAllGear(checked) {
  if (!checked && !confirm("Clear all gear? This also un-completes every mask in the checklist, because masks, bottles, songs and equipment are synced with the gear list.")) return;
  if (checked) GEAR_ITEMS.forEach(g => ownedGearSet.add(g.id)); else ownedGearSet.clear();
  for (const maskId of Object.values(GEAR_TO_MASK)) { if (checked) checkedSet.add(maskId); else checkedSet.delete(maskId); }
  syncGearFromItems();
  save(); render();
}

function toggleInventoryPanel() { invOpen = !invOpen; save(); renderInventory(); }

function toggleItem(id) {
  const nowChecked = !checkedSet.has(id);
  markItemChecked(id, nowChecked);
  save(); render();
  if (nowChecked && hideCompleted && ui.view === "checklist") showUndoToast(id);
}

let toastTimer = null;
function showUndoToast(id) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.innerHTML = `Marked <strong>${ITEM_BY_ID[id].title}</strong> complete (hidden). <button type="button" onclick="undoComplete('${id}')">Undo</button>`;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 6000);
}
function undoComplete(id) {
  markItemChecked(id, false);
  document.getElementById("toast").classList.remove("show");
  save(); render();
}

function toggleSubStep(subId, parentId) {
  const nowDone = !subCheckedSet.has(subId);
  if (nowDone) subCheckedSet.add(subId); else subCheckedSet.delete(subId);
  const parent = ITEM_BY_ID[parentId];
  if (parent && parent.steps && parent.steps.length) {
    const allDone = parent.steps.every((_, idx) => subCheckedSet.has(stepKey(parent, idx)));
    if (allDone) markItemChecked(parentId, true);
    // Unticking a single step deliberately leaves the item (and its mask/bottle gear) checked
  }
  save(); render();
}

function toggleStepsPanel(id) { if (openStepsSet.has(id)) openStepsSet.delete(id); else openStepsSet.add(id); save(); render(); }
function toggleAllSteps(expand) { if (expand) ITEMS.forEach(i => openStepsSet.add(i.id)); else openStepsSet.clear(); save(); render(); }

function toggleNotes(id) { if (notesOpen.has(id)) notesOpen.delete(id); else notesOpen.add(id); render(); }

  if (value.trim()) notes[id] = value; else delete notes[id];

  const badge = document.getElementById(`note-tag-${id}`);

function changeFairy(id, delta) {
  const v = Math.max(0, Math.min(15, (fairyCounts[id] || 0) + delta));
  fairyCounts[id] = v;
  save(); render();
}

function onHideCompletedChange() { hideCompleted = document.getElementById("hide-completed-filter").checked; forceShowId = null; save(); render(); }
function onGroupChange() { ui.group = document.getElementById("group-mode").value; save(); render(); }
function onSortChange() { ui.sort = document.getElementById("sort-mode").value; save(); render(); }

// ==================== EXPORT / IMPORT ====================
function buildExport() {
  return {
    app: "mm3d-tracker", version: 3, appVersion: APP_VERSION, exportedAt: new Date().toISOString(),
    checked: [...checkedSet], substeps: [...subCheckedSet], openSteps: [...openStepsSet],
    gear: [...ownedGearSet], notes, fairyCounts, hideCompleted, invOpen, ui
  };
}
function exportProgress() {
  const blob = new Blob([JSON.stringify(buildExport(), null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `mm3d-progress-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function applyImport(data) {
  if (!data || data.app !== "mm3d-tracker") throw new Error("This file isn't a Majora's Mask tracker save.");
  const arr = v => (Array.isArray(v) ? v : []);
  checkedSet = new Set(arr(data.checked));
  const importedSteps = migrateStepKeys(arr(data.substeps)); // also converts version-2 exports
  subCheckedSet = importedSteps;
  openStepsSet = new Set(arr(data.openSteps));
  ownedGearSet = new Set(arr(data.gear));
  notes = data.notes;
  fairyCounts = data.fairyCounts;
  if (typeof data.hideCompleted === "boolean") hideCompleted = data.hideCompleted;
  if (typeof data.invOpen === "boolean") invOpen = data.invOpen;
  ui = data.ui; // validated field by field in sanitizeState()
  sanitizeState(); syncGearFromItems(); save(); render();
  const rawSteps = arr(data.substeps);
  const dropped = rawSteps.filter(k => { const m = [...migrateStepKeys([k])][0]; return !m || !subCheckedSet.has(m); }).length;
  if (dropped > 0) alert(`Imported. ${dropped} ticked sub-step(s) were skipped because those steps were reworded or removed since the save was exported.`);
}
function importProgress(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (confirm("Replace your current progress with the imported file?")) applyImport(data);
    } catch (e) { alert("Couldn't import: " + e.message); }
    input.value = "";
  };
  reader.onerror = () => { alert("Couldn't read that file."); input.value = ""; };
  reader.readAsText(file);
}

// ==================== RENDERING ====================
function renderInventory() {
  const panel = document.getElementById("inventory-panel");
  const container = document.getElementById("inventory-grid-container");
  const summary = document.getElementById("owned-summary");
  panel.style.display = invOpen ? "block" : "none";

  const groups = {};
  for (const g of GEAR_ITEMS) (groups[g.group] = groups[g.group] || []).push(g);

  let html = "";
  for (const [groupName, list] of Object.entries(groups)) {
    html += `<div class="inv-group-title">${groupName}</div><div class="inv-grid">`;
    for (const g of list) {
      const isOwned = ownedGearSet.has(g.id);
      const src = gearSourceText(g.id);
      const srcIds = GEAR_TO_MASK[g.id] ? [] : gearSourceItems(g.id).slice(0, 4);
      html += `
        <label class="inv-item ${isOwned ? "owned" : ""}" title="${escAttr(src)}">
          <input type="checkbox" ${isOwned ? "checked" : ""} onchange="toggleGear('${g.id}')" />
          <span class="inv-text"><span class="inv-label">${g.label}</span><span class="inv-how">${escAttr(src)}</span>${srcIds.length ? `<span class="inv-jump">${srcIds.map(id => `<a href="#" onclick="event.preventDefault();event.stopPropagation();jumpTo('${id}')">${ITEM_BY_ID[id] ? escAttr(ITEM_BY_ID[id].title) : id}</a>`).join(" · ")}</span>` : ""}</span>
        </label>`;

function updateStats() {
  let hp = 0, hc = 0, masks = 0, bottles = 0, fairies = 0, songs = 0, equip = 0;
  for (const item of ITEMS) {
    if (checkedSet.has(item.id)) {
      if (item.type === "heart") hp++;
      else if (item.type === "container") hc++;
      else if (item.type === "mask") masks++;
      else if (item.type === "bottle") bottles++;
      else if (item.type === "fairy") fairies++;
      else if (item.type === "song") songs++;
      else if (item.type === "gear") equip++;
    }
  }
  const totalHearts = 3 + hc + Math.floor(hp / 4);
  const remainder = hp % 4;
  const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
  set("heart-meter", `${totalHearts}${remainder ? ` (+${remainder}/4)` : ""} / 20 Hearts`);
  set("hp-count", `${hp} / 52`);
  set("hc-count", `${hc} / 4`);
  set("mask-count", `${masks} / 24`);
  set("bottle-count", `${bottles} / 7`);
  set("fairy-count", `${fairies} / 4`);
  set("song-count", `${songs} / 10`);
  set("equip-count", `${equip} / 10`);
  set("gear-count", `${ownedGearSet.size} / ${GEAR_ITEMS.length}`);
}

function renderCard(item, opts = {}) {

  const steps = item.steps || [];
  const doneCount = steps.filter((_, idx) => subCheckedSet.has(stepKey(item, idx))).length;

  const gearChips = (item.requiresGear || []).map(r => {
    const own = reqOwned(r);

  }).join("");

  const nowBadge = opts.nowWindows && opts.nowWindows.length

  let subHtml = "";

    ? `<textarea class="notes-box" placeholder="Your notes for this item (saved automatically)..." oninput="setNote('${item.id}', this.value)">${escHtml(notes[item.id] || "")}</textarea>` : "";

  return `
    <div class="item ${isChecked ? "checked" : ""}" id="item-${item.id}">
      <input type="checkbox" class="main-check" ${isChecked ? "checked" : ""} onchange="toggleItem('${item.id}')" />
      <div class="item-body">
        <div class="item-header">
          <span class="item-title" role="button" tabindex="0" title="Show or hide steps" onclick="toggleStepsPanel('${item.id}')">${item.title}</span>
          <span class="tag ${item.type}">${tagLabel}</span>
          <span class="tag day">${item.day}</span>
          <span class="tag tod">${item.tod}</span>
          ${missing === 0 ? `<span class="tag ready">Have Gear</span>` : `<span class="tag missing">Missing ${missing}</span>`}
          ${SAME_CYCLE.has(item.id) ? `<span class="tag cycle">One cycle</span>` : ""}
<span class="tag note" id="note-tag-${item.id}" style="${hasNote ? "" : "display:none"}">📝 Note</span>
          ${nowBadge}
        </div>
        <div class="item-desc">${item.desc}</div>
        <div class="req-block">
          ${gearChips ? `<div class="req-row"><span class="req-label">Required</span>${gearChips}</div>` : ""}
          ${item.req ? `<div class="req-row"><span class="req-label">Conditions</span><span class="cond-text">${item.req}</span></div>` : ""}
          ${sched.length ? `<div class="req-row"><span class="req-label">When</span>${sched.map(w => `<span class="when-chip" title="${escAttr(w.l)}">${fmtWindow(w)}</span>`).join("")}</div>` : ""}
          ${howTo ? `<div class="req-row how-row"><span class="req-label">How to get</span><div class="how-list">${howTo}</div></div>` : ""}
          ${needs.length ? `<div class="req-row"><span class="req-label">Needs first</span>${needs.map(itemLink).join("")}</div>` : ""}
          ${unlocks.length ? `<div class="req-row"><span class="req-label">Unlocks</span>${(expandedUnlocks.has(item.id) ? unlocks : unlocks.slice(0, 6)).map(itemLink).join("")}${unlocks.length > 6 ? `<span class="link-chip" role="button" tabindex="0" onclick="toggleUnlocks('${item.id}')">${expandedUnlocks.has(item.id) ? "Show less" : `+${unlocks.length - 6} more`}</span>` : ""}</div>` : ""}
        </div>
        <div class="item-meta">
          <a href="${item.guide}" target="_blank" rel="noopener noreferrer">Guide Link ↗</a>
          ${steps.length ? `<button type="button" class="toggle-steps-btn" onclick="toggleStepsPanel('${item.id}')">${isOpen ? "Hide Steps" : "Steps"} (${doneCount}/${steps.length})</button>` : ""}
          <button type="button" class="toggle-steps-btn" onclick="toggleNotes('${item.id}')">${notesOpen.has(item.id) ? "Close Notes" : hasNote ? "Edit Notes" : "Add Notes"}</button>
          ${fairyCounter}
        </div>
        ${notesHtml}
        ${subHtml}
      </div>
    </div>`;
}

function baseFilter(item, f) {
  if (item.id === forceShowId) return true;
  if (f.typeFilter !== "all" && item.type !== f.typeFilter) return false;
  if (f.regionFilter !== "all" && item.region !== f.regionFilter) return false;
  if (f.ownedOnly && !hasAllRequiredGear(item)) return false;
  if (f.query) {
    const gearText = (item.requiresGear || []).map(reqLabel).join(" ");
    const hay = `${item.title} ${item.desc} ${item.region} ${item.day} ${item.tod} ${item.req} ${gearText} ${(item.steps || []).join(" ")} ${notes[item.id] || ""}`.toLowerCase();
    if (!hay.includes(f.query)) return false;
  }
  return true;
}

function readFilters() {
  return {
    query: document.getElementById("search").value.trim().toLowerCase(),
    typeFilter: document.getElementById("type-filter").value,
    dayFilter: document.getElementById("day-filter").value,
    todFilter: document.getElementById("tod-filter").value,
    regionFilter: document.getElementById("region-filter").value,
    statusFilter: document.getElementById("status-filter").value,
    ownedOnly: document.getElementById("owned-only-filter").checked
  };
}

function renderChecklist(f) {
  const filtered = ITEMS.filter(item => {
    if (item.id === forceShowId) return true;
    if (!baseFilter(item, f)) return false;
    const isChecked = checkedSet.has(item.id);
    if (f.dayFilter !== "all" && item.day !== f.dayFilter) return false;
    if (f.todFilter !== "all" && item.tod !== f.todFilter) return false;
    if (f.statusFilter === "checked" && !isChecked) return false;
    if (f.statusFilter === "unchecked" && isChecked) return false;
    if (hideCompleted && isChecked && f.statusFilter !== "checked") return false;
    return true;
  });

  if (!filtered.length) {
    return `<div class="empty-state">No matching items found.${hideCompleted ? " (Completed items are hidden — untick “Hide Completed” to see them.)" : ""}</div>`;
  }

  const byType = ui.group === "type";
  const keyOf = i => byType ? i.type : i.region;
  const groups = {};
  for (const item of filtered) (groups[keyOf(item)] = groups[keyOf(item)] || []).push(item);
  const TYPE_TITLES = { mask: "Masks", container: "Boss Heart Containers", heart: "Pieces of Heart", bottle: "Bottles", fairy: "Stray Fairies / Great Fairies", song: "Songs", gear: "Equipment" };
  const keys = byType ? Object.keys(TYPE_TITLES).filter(k => groups[k]) : Object.keys(groups);

  let html = "";
  for (const key of keys) {
    const list = groups[key];
    const regionAll = ITEMS.filter(i => keyOf(i) === key && (f.typeFilter === "all" || i.type === f.typeFilter));
    const doneInRegion = regionAll.filter(i => checkedSet.has(i.id)).length;
    const pct = regionAll.length ? Math.round((doneInRegion / regionAll.length) * 100) : 0;
    const title = byType ? TYPE_TITLES[key] : (key === "Ikana Canyon" ? "Ikana" : key);
    html += `
      <div class="section-title">
        <span>${title}</span>
        <span class="section-count">${doneInRegion} / ${regionAll.length} collected · ${pct}%</span>
      </div>
      <div class="region-progress"><div style="width:${pct}%"></div></div>
      <div class="checklist">${sortItems(list).map(i => renderCard(i, { query: f.query })).join("")}</div>`;
  }
  return html;
}

// Absolute time inside the cycle (hours); planner clock hours run 6..30 per day
function evKey(w) { return (w.d - 1) * 24 + w.s; }
function evEnd(w) { return (w.d - 1) * 24 + w.e; }
// Which still-missing gear for `item` can be picked up from another timed item that fits earlier in
// the same cycle (and whose own gear can be sorted the same way). Returns {missing, via}.
const planCache = new Map(); // cleared at the start of every planner render
function planGear(item, deadline, visited) {
  const cacheKey = item.id + "|" + deadline + "|" + [...visited].sort().join(",");
  if (planCache.has(cacheKey)) return planCache.get(cacheKey);
  const seen = new Set(visited).add(item.id);
  let missing = 0; const via = [];
  for (const r of item.requiresGear || []) {
    if (reqOwned(r)) continue;
    let found = null;
    for (const gid of (Array.isArray(r) ? r : [r])) {
      if (GEAR_ALL_OF.has(gid)) continue; // needs every source item, not just one
      for (const srcId of gearSourceItems(gid)) {
        const src = ITEM_BY_ID[srcId];
        // a source you already ticked still counts when you do not hold the gear (e.g. you unticked it), so the planner can show how to get it back
        if (!src || srcId === "m1" || BASIC_GEAR.has(gid) || seen.has(srcId)) continue;
        // Items with no time limit can be done from the start of Day 1
        const fixed = GEAR_WINDOW[gid] || ITEM_DONE_WINDOW[srcId];
        const w = fixed ? (evKey(fixed) < deadline ? { ...fixed, done: true } : null)
          : SCHEDULES[srcId] ? SCHEDULES[srcId].find(x => evKey(x) < deadline) : { d: 1, s: 6, e: 30, anytime: true };
        if (!w) continue;
        const sub = planGear(src, w.anytime ? deadline : evEnd(w), seen);
        if (sub.missing === 0) { found = { gid, src, w, sub }; break; }
      }
      if (found) break;
    }
    if (found) via.push(found); else missing++;
  }
  const result = { missing, via };
  planCache.set(cacheKey, result);
  return result;
}
function chainText(via, depth = 0) {
  return via.map(v => `${gearName(v.gid)} <- <a onclick="jumpTo('${v.src.id}')">${v.src.title}</a> (${fmtWindow(v.w)})` + (v.sub.via.length ? ` [first: ${chainText(v.sub.via, depth + 1)}]` : "")).join("; ");
}

// When an untimed item first becomes doable: after the latest earlier item it needs (timed or not)
function readyInfo(item, seen = new Set()) {
  const plan = planGear(item, 96, seen);
  let key = 6, depth = 0, src = null;
  for (const v of plan.via) {
    let k, dp;
    // an untimed prerequisite is done on its own day, so what it unlocks moves to the next day (Day 3 at most)
    if (v.w.anytime) { const r = readyInfo(v.src, new Set(seen).add(item.id)); k = Math.max(r.key, Math.min(r.key + 24, 54)); dp = r.depth + 1; }
    else { k = v.w.done ? Math.min(evEnd(v.w), 77.5) : evKey(v.w); dp = 1; } // a finished quest step is only usable after its window
    if (k > key || (k === key && dp > depth)) { key = k; depth = dp; src = v.src; }
  }
  return { key, depth, src };
}

function renderPlanner(f) {
  planCache.clear();
  const events = [];
  // "Items I Have On Me" here also keeps items whose missing gear comes from an earlier item in the cycle
  const pf = { ...f, ownedOnly: false };
  for (const item of ITEMS) {
    if (checkedSet.has(item.id) || !baseFilter(item, pf)) continue;
    for (const w of SCHEDULES[item.id] || []) {
      if (f.ownedOnly && planGear(item, evEnd(w), new Set()).missing > 0) continue;
      events.push({ ...w, item });
    }
  }
  // Items with no time limit can be done from the start, so they go at the top of Day 1
  for (const item of ITEMS) {
    if (checkedSet.has(item.id) || SCHEDULES[item.id] || !baseFilter(item, pf)) continue;
    if (f.ownedOnly && planGear(item, 96, new Set()).missing > 0) continue;
    const r = readyInfo(item);
    const d = Math.floor((r.key - 6) / 24) + 1, st = r.key - (d - 1) * 24;
    events.push({ d, s: st, e: 30, l: r.src ? `No time limit — once you have done ${r.src.title}` : "No time limit — do it whenever", anytime: true, depth: r.depth, item });
  }
  if (!events.length) return `<div class="empty-state">Nothing left for the current filters.</div>`;
  // at the same start: free items first, then timed items, then untimed items that depend on something earlier
  const rank = ev => ev.anytime ? (ev.depth ? 2 : 0) : 1;
  events.sort((a, b) => a.d - b.d || a.s - b.s || rank(a) - rank(b) || (a.depth || 0) - (b.depth || 0) || a.e - b.e);

  let html = `<p class="planner-intro">Every item you still need, in the order it happens across one 3-day cycle. Items with no time limit sit at the top of Day 1. Items tagged <span class="tag cycle">One cycle</span> fail if you play the Song of Time partway through. Gear you don’t have yet counts as available if you can get it from an earlier timed item in the same cycle (shown under “Get first”). Click a title to open it in the checklist.</p>`;
  let current = "";
  for (const ev of events) {
    const period = periodName(ev.d, ev.s);
    if (period !== current) {
      current = period;
      html += `<div class="section-title planner-period"><span>${period} ${period.startsWith("Day") ? "☀️" : "🌙"}</span></div>`;
    }
    const plan = planGear(ev.item, ev.anytime ? 96 : evEnd(ev), new Set());
    const missing = plan.missing;
    html += `
      <div class="planner-row">
        <div class="planner-time">${ev.anytime ? "Any time" : `${fmtHour(ev.s)} – ${fmtHour(ev.e)}`}</div>
        <div>
          <div class="planner-title" role="button" tabindex="0" onclick="jumpTo('${ev.item.id}')">${ev.item.title}</div>
          <div class="planner-label">${ev.l}</div>
          ${plan.via.length ? `<div class="planner-chain">Get first: ${chainText(plan.via)}</div>` : ""}
        </div>
        <div class="planner-tags">
          ${SAME_CYCLE.has(ev.item.id) ? `<span class="tag cycle">One cycle</span>` : ""}
          ${missing === 0 ? (plan.via.length ? `<span class="tag chain">Gear from earlier item</span>` : `<span class="tag ready">Have Gear</span>`) : `<span class="tag missing">Missing ${missing}${plan.via.length ? ` · +${plan.via.length} earlier` : ""}</span>`}
        </div>
      </div>`;
  }
  return html;
}

function windowsNow(item, d, h) {
  return (SCHEDULES[item.id] || []).filter(w => w.d === d && h >= w.s && h < w.e);
}

function renderNow(f) {
  const d = ui.nowDay, h = ui.nowHour;
  const timed = [], anytime = [];
  for (const item of ITEMS) {
    if (checkedSet.has(item.id) || !baseFilter(item, f)) continue;
    const ws = windowsNow(item, d, h);
    if (ws.length) timed.push({ item, ws });
    else if (ui.nowAnytime && !SCHEDULES[item.id] && item.day === "Anytime" && hasAllRequiredGear(item)) anytime.push(item);
  }
  let html = `<p class="planner-intro">${periodName(d, h)}, ${fmtHour(h)} — what you can do right now.</p>`;
  if (timed.length) {
    const sorted = ui.sort === "closest"
      ? timed.sort((a, b) => compareClosest(a.item, b.item))
      : timed.sort((a, b) => Math.min(...a.ws.map(w => w.e)) - Math.min(...b.ws.map(w => w.e)));
    html += `<div class="section-title"><span>Happening now</span><span class="section-count">${timed.length} (${ui.sort === "closest" ? "closest to done first" : "ending soonest first"})</span></div>`;
    html += `<div class="checklist">${sorted.map(t => renderCard(t.item, { query: f.query, nowWindows: t.ws })).join("")}</div>`;
  } else {
    html += `<div class="empty-state">Nothing time-limited is happening at this moment.</div>`;
  }
  if (anytime.length) {
    html += `<div class="section-title"><span>Anytime — you have the gear</span><span class="section-count">${anytime.length}</span></div>`;
    html += `<div class="checklist">${sortItems(anytime).map(i => renderCard(i, { query: f.query })).join("")}</div>`;
  }
  return html;
}

function syncControls() {
  document.querySelectorAll("#view-tabs button").forEach(b => b.classList.toggle("active", b.dataset.view === ui.view));
  document.getElementById("now-controls").classList.toggle("show", ui.view === "now");
  document.getElementById("hide-completed-filter").checked = hideCompleted;
  document.getElementById("sort-mode").value = ui.sort;
  document.getElementById("group-mode").value = ui.group;
  document.getElementById("now-day").value = String(ui.nowDay);
  document.getElementById("now-hour").value = String(ui.nowHour);
  document.getElementById("now-anytime").checked = ui.nowAnytime;
  // Day/time/status filters only apply to the checklist view
  ["day-filter", "tod-filter", "status-filter"].forEach(id => { document.getElementById(id).disabled = ui.view !== "checklist"; });
}

function render() {
  // A jumped-to item stays visible only until the user changes a filter or search
  if (forceShowId && JSON.stringify(readFilters()) !== jumpFilterSig) forceShowId = null;
  const scrollY = window.scrollY;
  renderInventory();
  updateStats();
  syncControls();
  const f = readFilters();
  const app = document.getElementById("app");
  if (ui.view === "planner") app.innerHTML = renderPlanner(f);
  else if (ui.view === "now") app.innerHTML = renderNow(f);
  else app.innerHTML = renderChecklist(f);
  if (window.scrollY !== scrollY) window.scrollTo(0, scrollY); // keep your place after clicks
}

// Keyboard support: Enter/Space activates anything marked role="button"
document.addEventListener("keydown", e => {
  const el = e.target;
  if ((e.key === "Enter" || e.key === " ") && el && el.getAttribute && el.getAttribute("role") === "button") {
    e.preventDefault();
    el.click();
  }
});

// Build the half-hour options for the Right Now clock (6:00 AM → 5:30 AM next morning)
(function buildHourOptions() {
  const sel = document.getElementById("now-hour");
  let html = "";
  for (let h = 6; h < 30; h += 0.5) html += `<option value="${h}">${fmtHour(h)}</option>`;
  sel.innerHTML = html;
})();

render();

</script>
</body>
</html>
